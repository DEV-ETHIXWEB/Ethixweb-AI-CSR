# Voice Runtime — holds the Twilio Media Stream WebSocket for every live
# call. The most latency- and availability-sensitive service here.
#
# Deploy from the MONOREPO ROOT so the Dockerfile's `turbo prune` can see
# the whole workspace:
#   fly deploy -c apps/voice-runtime/fly.toml --dockerfile apps/voice-runtime/Dockerfile .

app = "ethixweb-voice-runtime"
primary_region = "sjc"   # San Jose — Managed Postgres is not offered in sea, and
                         # co-locating the app with the DB matters more than
                         # Seattle-vs-San-Jose does for the caller (both US West).

[build]

[env]
  PORT = "3200"
  NODE_ENV = "production"
  # Must exceed SHUTDOWN_DRAIN_TIMEOUT_MS below, or calls are cut anyway.
  SHUTDOWN_DRAIN_TIMEOUT_MS = "30000"

[http_service]
  internal_port = 3200
  force_https = true
  # Call state (TTS playback, barge-in, timers, the STT session) lives in
  # memory on the machine holding the WebSocket. A scale event mid-call
  # drops that call, so this service never scales to zero and never
  # auto-stops.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# Longer than the 30s drain above, so the platform lets in-flight calls
# finish instead of SIGKILLing through them. Fly's default is 5s, which
# would make the drain pointless.
kill_timeout = "35s"

[[vm]]
  # Performance, not shared: shared-CPU steal time shows up as audio
  # stutter and dead air on a live call.
  size = "performance-1x"
  memory = "2gb"
