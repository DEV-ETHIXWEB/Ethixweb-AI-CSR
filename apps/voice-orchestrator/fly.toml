# Voice Orchestrator — per-turn conversation logic, prompt assembly and
# tool-calling. Stateless per request; conversation state lives in Redis.
#
#   fly deploy -c apps/voice-orchestrator/fly.toml --dockerfile apps/voice-orchestrator/Dockerfile .

app = "ethixweb-voice-orchestrator"
primary_region = "sjc"   # San Jose — Managed Postgres is not offered in sea, and
                         # co-locating the app with the DB matters more than
                         # Seattle-vs-San-Jose does for the caller (both US West).

[build]

[env]
  PORT = "3100"
  NODE_ENV = "production"

[http_service]
  internal_port = 3100
  force_https = true
  # Safe to scale: no per-call state is held in this process.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

kill_timeout = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
